spring.config.import=optional:file:.env[.properties]
spring.application.name=ApiGateway
# Cloud Run inyecta PORT; en local queda 8080
server.port=${PORT:8080}

# Seguridad y CORS
# Mismo secreto Base64 (mínimo 32 bytes decodificados) que usa Identidad para firmar
jwt.secret=${JWT_SECRET}
# Separados por coma; admite patrones, p. ej. https://*.web.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rutas: cada microservicio expone todo bajo /v1/<servicio>/**
# y el gateway reenvía la ruta tal cual (sin reescribir).
# En Cloud Run las URL se reemplazan con variables de entorno.
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=${IDENTITY_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/v1/identity/**

spring.cloud.gateway.server.webmvc.routes[1].id=fleet
spring.cloud.gateway.server.webmvc.routes[1].uri=${FLEET_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/v1/fleet/**

spring.cloud.gateway.server.webmvc.routes[2].id=trips
spring.cloud.gateway.server.webmvc.routes[2].uri=${TRIPS_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/v1/trips/**

spring.cloud.gateway.server.webmvc.routes[3].id=tickets
spring.cloud.gateway.server.webmvc.routes[3].uri=${TICKETS_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/v1/tickets/**

spring.cloud.gateway.server.webmvc.routes[4].id=customers
spring.cloud.gateway.server.webmvc.routes[4].uri=${CUSTOMERS_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/v1/customers/**

spring.cloud.gateway.server.webmvc.routes[5].id=rentals
spring.cloud.gateway.server.webmvc.routes[5].uri=${RENTALS_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/v1/rentals/**

spring.cloud.gateway.server.webmvc.routes[6].id=costs
spring.cloud.gateway.server.webmvc.routes[6].uri=${COSTS_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/v1/costs/**

spring.cloud.gateway.server.webmvc.routes[7].id=notifications
spring.cloud.gateway.server.webmvc.routes[7].uri=${NOTIFICATIONS_URL:http://localhost:8088}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/v1/notifications/**

spring.cloud.gateway.server.webmvc.routes[8].id=reports
spring.cloud.gateway.server.webmvc.routes[8].uri=${REPORTS_URL:http://localhost:8089}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/v1/reports/**

# Swagger UI unificado: cada servicio publica su OpenAPI en
# /v1/<servicio>/v3/api-docs, así que lo cubre su propia ruta.
springdoc.swagger-ui.urls[0].name=Identidad
springdoc.swagger-ui.urls[0].url=/v1/identity/v3/api-docs
springdoc.swagger-ui.urls[1].name=Flota
springdoc.swagger-ui.urls[1].url=/v1/fleet/v3/api-docs
springdoc.swagger-ui.urls[2].name=Rutas y viajes
springdoc.swagger-ui.urls[2].url=/v1/trips/v3/api-docs
springdoc.swagger-ui.urls[3].name=Boletos
springdoc.swagger-ui.urls[3].url=/v1/tickets/v3/api-docs
springdoc.swagger-ui.urls[4].name=Clientes y cartera
springdoc.swagger-ui.urls[4].url=/v1/customers/v3/api-docs
springdoc.swagger-ui.urls[5].name=Alquileres
springdoc.swagger-ui.urls[5].url=/v1/rentals/v3/api-docs
springdoc.swagger-ui.urls[6].name=Costos operativos
springdoc.swagger-ui.urls[6].url=/v1/costs/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notificaciones
springdoc.swagger-ui.urls[7].url=/v1/notifications/v3/api-docs
springdoc.swagger-ui.urls[8].name=Reportes
springdoc.swagger-ui.urls[8].url=/v1/reports/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
