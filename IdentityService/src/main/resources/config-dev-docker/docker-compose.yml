version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: ./config-dev-docker/Dockerfile
    container_name: idetity-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_FILE_PROD: ${STORAGE_FILE_PROD}
      STORAGE_FILE_LOCAL: ${STORAGE_FILE_LOCAL}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

networks:
  default:
    external:
      name: microservices-net