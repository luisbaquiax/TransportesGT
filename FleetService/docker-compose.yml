
services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bd_flota
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5437:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mi_base_datos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
