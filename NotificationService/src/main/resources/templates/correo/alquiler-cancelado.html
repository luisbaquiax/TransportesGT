<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{correo/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Tu alquiler fue cancelado</title>
</head>
<body>
<main>
    <p>Tu alquiler <strong th:text="${datos.idAlquiler()}">id</strong> fue cancelado porque el viaje fue eliminado.</p>
    <table role="presentation" cellpadding="0" cellspacing="0">
        <tr><td style="padding:4px 12px 4px 0;color:#6b7785;">Monto</td><td th:text="${fmt.dinero(datos.precioTotal())}">Q 3,800.00</td></tr>
        <tr><td style="padding:4px 12px 4px 0;color:#6b7785;">Cancelado el</td><td th:text="${fmt.fechaHora(datos.canceladoEn())}">22/10/2026 03:15</td></tr>
    </table>
    <p th:if="${reembolso}">El monto se acreditará en tu cartera digital. Recibirás otro correo cuando se aplique el reembolso.</p>
    <p th:unless="${reembolso}">Como el pago se hizo en la sucursal, acércate a ella para gestionar la devolución.</p>
</main>
</body>
</html>
