spring.config.import=optional:file:.env[.properties]
spring.application.name=NotificationService
# Perfil por defecto en local; en producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=${SPRING_PROFILES_DEFAULT:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8088}
# El gateway reenvía /v1/notifications/** sin reescribir la ruta
server.servlet.context-path=/v1/notifications

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# JWT emitido por Identidad: este servicio solo lo valida (firma y claim iss)
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:servicio-identidad}

# ---------------------------------------------------------------
# Notificaciones
# ---------------------------------------------------------------
# Enlaces de EnlaceContrasenaEmitido: ${FRONTEND_URL}${ruta}?token=...
notificaciones.frontend-url=${FRONTEND_URL:http://localhost:5173}
notificaciones.ruta-restablecer=/restablecer-contrasena
notificaciones.ruta-activar=/activar-cuenta
notificaciones.remitente=${MAIL_REMITENTE:Transportes GT <no-responder@transportes.gt>}
# Envío: lote por corrida, intervalo y reintentos (espera 1, 2, 4, 8 min; al 5.º fallo queda FALLIDA)
notificaciones.envio.lote=20
notificaciones.envio.intervalo-ms=30000
notificaciones.envio.max-intentos=5
notificaciones.envio.espera-inicial=1m
# Avisos de licencia: diario a las 7:00 (America/Guatemala)
notificaciones.licencias.cron=0 0 7 * * *

# ---------------------------------------------------------------
# Eventos (librería EventosComunesTrasnportesGt)
# La librería declara las colas, enlaces y DLQ a partir de los ManejadorEvento registrados.
# Este servicio no publica, pero el poller del outbox de la librería siempre corre: la tabla outbox_evento existe
# vacía. La librería limpia el outbox (publicados con más de 24 h) a las 3:30 a. m.
# ---------------------------------------------------------------
eventos.servicio=notificaciones
eventos.outbox.intervalo-ms=1000
eventos.outbox.lote=50
eventos.outbox.retencion-horas=24

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.addresses=${RABBITMQ_URL}

# Publicador (outbox): confirmar que el broker recibió y enrutó el mensaje
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Consumidor: reintentos con espera creciente (1 s, 2 s, 4 s) y luego DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Al agotar reintentos NO reencolar: así el mensaje va a la DLQ de su cola
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# ==========================
# HikariCP
# ==========================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================
# Correo (SMTP)
# Producción: STARTTLS en 587 (Cloud Run bloquea el 25). Local con Mailpit: MAIL_HOST=localhost, MAIL_PORT=1025,
# MAIL_SMTP_AUTH=false (sin usuario ni contraseña)
# ==========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin estos límites, un SMTP colgado bloquearía el job de envío
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Plantillas de correo (templates/correo/*.html)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Swagger
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
spring.jpa.properties.hibernate.use_sql_comments=false
logging.pattern.correlation=[%X{idCorrelacion:-}]

#---
spring.config.activate.on-profile=dev
# ============ Perfil dev ============
spring.jpa.show-sql=true
logging.level.org.transportsgt=DEBUG
management.endpoint.health.show-details=always

#---
spring.config.activate.on-profile=prod
# ============ Perfil prod ============
# Todo secreto llega por variables de entorno (sin valores por defecto)
spring.jpa.show-sql=false
logging.level.org.transportsgt=INFO
management.endpoint.health.show-details=never
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:true}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
